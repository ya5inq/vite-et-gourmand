name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Lint · Typecheck · Tests backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: vite_et_gourmand
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vite_et_gourmand"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:pass@localhost:5432/vite_et_gourmand
      ACCESS_TOKEN_SECRET: ci-access-secret
      REFRESH_TOKEN_SECRET: ci-refresh-secret
      ACCOUNT_TOKEN_SECRET: ci-account-secret
      RESET_TOKEN_SECRET: ci-reset-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests backend
        run: pnpm test:be
