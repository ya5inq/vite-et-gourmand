# ============================================================
# Blueprint Render — Vite & Gourmand
# ------------------------------------------------------------
# Déploie en une fois : backend + PostgreSQL + client + back-office.
# MongoDB est fourni séparément par MongoDB Atlas (M0 gratuit) :
#   renseigner MONGO_URL dans les variables du service `backend`.
#
# Mise en place : Render Dashboard → New → Blueprint → sélectionner ce dépôt.
# Voir docs/DEPLOYMENT_RENDER.md pour la procédure détaillée.
# ============================================================

databases:
  - name: veg-postgres
    plan: free
    region: frankfurt
    databaseName: vite_et_gourmand
    user: veg

services:
  # ---------- Backend (API Hono) ----------
  - type: web
    name: veg-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /api/doc
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTO_MIGRATION
        value: 'true'
      - key: DATABASE_URL
        fromDatabase:
          name: veg-postgres
          property: connectionString
      # MongoDB Atlas — à renseigner manuellement (secret)
      - key: MONGO_URL
        sync: false
      # Secrets JWT — générés automatiquement par Render
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: ACCOUNT_TOKEN_SECRET
        generateValue: true
      - key: RESET_TOKEN_SECRET
        generateValue: true
      # E-mails (optionnel) — sinon journalisés
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: no-reply@vite-et-gourmand.com
      - key: CONTACT_EMAIL
        value: contact@vite-et-gourmand.com
      # Origines CORS — URLs publiques complètes des deux fronts.
      # NB: on ne peut PAS utiliser `fromService/property: host` ici : Render
      # renvoie le hostname SANS le schéma `https://`, ce qui casse le CORS
      # (le backend compare l'Origin complet du navigateur). On renseigne donc
      # les URLs complètes à la main (Environment de veg-backend).
      - key: FRONTEND_URL
        sync: false
      - key: BACK_OFFICE_URL
        sync: false

  # ---------- Client (Next.js SSR) ----------
  - type: web
    name: veg-client
    runtime: docker
    dockerfilePath: ./client/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    envVars:
      # URL publique de l'API (figée au build via l'ARG du Dockerfile)
      - key: NEXT_PUBLIC_API_URL
        sync: false

  # ---------- Back-office (SPA Vite statique) ----------
  - type: web
    name: veg-back-office
    runtime: static
    buildCommand: pnpm install --frozen-lockfile --filter back-office... && VITE_API_URL=$VITE_API_URL pnpm --filter back-office build
    staticPublishPath: ./back-office/dist
    envVars:
      # Épingle Node 20 (Render prend une version très récente par défaut)
      - key: NODE_VERSION
        value: '20'
      - key: VITE_API_URL
        sync: false
    routes:
      # Routing SPA : tout retombe sur index.html (react-router BrowserRouter)
      - type: rewrite
        source: /*
        destination: /index.html
